{% extends "catalog/base.html" %}
{% block content %}
    <div class="container">
        <form class="row" method="post" enctype="multipart/form-data">
            <div class="col-6">
                <div class="card">
                    <div class="card-body">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <button type="submit" class="btn btn-primary">Войти</button>
                        <a class="p-2 btn btn-outline-primary" href="{% url "users:reset_password" %}">Востановление пароля</a>
                    </div>
                </div>
            </div>
            <div class="card-body">
                {{ formset.management_form }}
                {% for form in formset.forms %}
                    {{ form.as_p }}
                    <h></h>
                {% endfor %}
            </div>
        </form>
    </div>

{% endblock %}
